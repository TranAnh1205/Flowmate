server:
  port: 8080

spring:
  application:
    name: gateway-service
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-sensitive
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/login,/api/v1/auth/register,/api/v1/auth/refresh-token
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@ipKeyResolver}"
                    redis-rate-limiter.replenishRate: ${RATE_LIMIT_AUTH_REPLENISH_RATE:5}
                    redis-rate-limiter.burstCapacity: ${RATE_LIMIT_AUTH_BURST_CAPACITY:600}
                    redis-rate-limiter.requestedTokens: ${RATE_LIMIT_AUTH_REQUESTED_TOKENS:60}
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/**,/api/v1/users/**,/api/v1/admin/users/**,/api/v1/admin/audit-logs/**,/api/v1/admin/statistics/users/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@principalOrIpKeyResolver}"
                    redis-rate-limiter.replenishRate: ${RATE_LIMIT_GENERAL_REPLENISH_RATE:100}
                    redis-rate-limiter.burstCapacity: ${RATE_LIMIT_GENERAL_BURST_CAPACITY:1800}
                    redis-rate-limiter.requestedTokens: ${RATE_LIMIT_GENERAL_REQUESTED_TOKENS:60}
            - id: task-service
              uri: ${TASK_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/tasks/**,/api/v1/projects/**,/api/v1/categories/**,/api/v1/tags/**,/api/v1/goals/**,/api/v1/statistics/**,/api/v1/admin/statistics/tasks/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@principalOrIpKeyResolver}"
                    redis-rate-limiter.replenishRate: ${RATE_LIMIT_GENERAL_REPLENISH_RATE:100}
                    redis-rate-limiter.burstCapacity: ${RATE_LIMIT_GENERAL_BURST_CAPACITY:1800}
                    redis-rate-limiter.requestedTokens: ${RATE_LIMIT_GENERAL_REQUESTED_TOKENS:60}
            - id: ai-service
              uri: ${AI_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/ai/**,/api/v1/admin/ai/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@principalOrIpKeyResolver}"
                    redis-rate-limiter.replenishRate: ${RATE_LIMIT_AI_REPLENISH_RATE:10}
                    redis-rate-limiter.burstCapacity: ${RATE_LIMIT_AI_BURST_CAPACITY:180}
                    redis-rate-limiter.requestedTokens: ${RATE_LIMIT_AI_REQUESTED_TOKENS:60}
            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/v1/notifications/**,/api/v1/reminders/**,/api/v1/admin/statistics/notifications/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@principalOrIpKeyResolver}"
                    redis-rate-limiter.replenishRate: ${RATE_LIMIT_GENERAL_REPLENISH_RATE:100}
                    redis-rate-limiter.burstCapacity: ${RATE_LIMIT_GENERAL_BURST_CAPACITY:1800}
                    redis-rate-limiter.requestedTokens: ${RATE_LIMIT_GENERAL_REQUESTED_TOKENS:60}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
