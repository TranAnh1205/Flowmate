server:
  port: 8082
spring:
  application:
    name: task-service
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/task_db}
    username: ${DB_USERNAME:smarttask}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  internal-service-key: ${INTERNAL_SERVICE_KEY:}
  services:
    notification-url: ${NOTIFICATION_SERVICE_URL:http://localhost:8084}
  reminder-sync:
    poll-delay-ms: ${REMINDER_SYNC_POLL_DELAY_MS:2000}
