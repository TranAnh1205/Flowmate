server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/auth_db}
    username: ${DB_USERNAME:smarttask}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

app:
  security:
    issuer: smart-task-auth
    access-token-ttl: PT15M
    refresh-token-ttl: P30D
    admin-action-token-ttl: PT5M
    key-path: ${JWT_KEY_PATH:}
  admin-bootstrap:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    full-name: ${BOOTSTRAP_ADMIN_NAME:Flowmate Administrator}

management:
  endpoints:
    web:
      exposure:
        include: health,info
